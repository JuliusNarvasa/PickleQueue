# PickleQueue tracking - nginx snippets for picklequeue.bambaw-tumba.com
#
# (1) Map (http context): place at top level of a conf.d file or nginx.conf http {}.
#     Replace <TOKEN> with the real TRACKING_TOKEN.
map $uri $pq_tracking {
    default 0;
    "~^/tracking/<TOKEN>$" 1;
}

